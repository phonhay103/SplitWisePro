# A React + TypeScript app whose `lint` script is the whole typecheck
# (`tsc --noEmit`); there is no eslint config in the repo to reuse. The build
# stays out of the hook because vite build is slower than a commit.
# One-time setup per clone:  pre-commit install
repos:
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (npm run lint → tsc --noEmit)
        entry: npm run lint --silent
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # The hook builds gitleaks with the Go toolchain on first run, so Go must be
  # on PATH; the built binary is cached afterwards. Only the staged diff is
  # scanned, and matches are redacted in the output.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
